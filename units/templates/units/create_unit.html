{% extends "units/base.html" %}
{% block title %}Add unit · War simulator{% endblock %}
{% block content %}
  <section class="panel" style="max-width: 600px; margin-inline: auto;">
    <h1>Add a fighter unit</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
        <p>
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}<span class="errors">{{ error }}</span>{% endfor %}
        </p>
      {% endfor %}
      <button type="submit">Add fighter</button>
    </form>
  </section>
{% endblock %}
